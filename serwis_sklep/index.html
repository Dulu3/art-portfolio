<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kwestionariusz – Sklep internetowy</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <main class="page">
      <section class="survey-shell" aria-labelledby="survey-title">
        <div class="intro">
          <p class="eyebrow"><a href="../" class="back-link">&larr; Wszystkie formularze</a></p>
          <h1 id="survey-title">Kwestionariusz do wyceny sklepu internetowego</h1>
          <p>
            Formularz zbiera informacje potrzebne do przygotowania rzetelnej wyceny.
            Im dokładniejsze odpowiedzi, tym precyzyjniejsza oferta.
          </p>
        </div>

        <form id="survey-form" class="survey-form" novalidate>
          <div id="survey-sections"></div>

          <div class="bot-field" aria-hidden="true">
            <label for="website">Strona internetowa</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <label class="consent">
            <input id="consent" name="consent" type="checkbox" value="Tak" required>
            <span>Wyrażam zgodę na zapisanie odpowiedzi w celu przygotowania wyceny.</span>
          </label>
          <span class="error" data-error-for="consent"></span>

          <div class="actions">
            <button id="submit-button" type="submit">Wyślij kwestionariusz</button>
            <p id="form-status" class="status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>

    <script src="../config.js"></script>
    <script src="./survey-data.js"></script>
    <script src="../script.js"></script>
  </body>
</html>
