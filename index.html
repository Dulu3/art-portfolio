<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dulu.hehe — Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black:  #080808;
      --grey:   #1a1a1a;
      --mid:    #2a2a2a;
      --accent: #ff3d00;
      --text:   #e8e8e8;
      --muted:  #555;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      overflow-x: hidden;
    }


    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: 0.22; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }


    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      padding: 18px 32px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(8,8,8,0.98) 0%, transparent 100%);
    }
    .logo {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.6rem; letter-spacing: 0.12em;
      color: var(--text); text-decoration: none;
    }
    .logo em { color: var(--accent); font-style: normal; }

    nav { display: flex; gap: 24px; align-items: center; }
    nav a {
      font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.2s;
    }
    nav a:hover { color: var(--text); }


    .burger {
      display: none;
      flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 4px;
    }
    .burger span {
      display: block; width: 22px; height: 1px; background: var(--text);
      transition: all 0.25s;
    }
    .burger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }


    .mobile-nav {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8,8,8,0.98);
      z-index: 290;
      flex-direction: column; align-items: center; justify-content: center; gap: 40px;
    }
    .mobile-nav.open { display: flex; }
    .mobile-nav a {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.5rem; letter-spacing: 0.2em;
      color: var(--text); text-decoration: none; transition: color 0.2s;
    }
    .mobile-nav a:hover { color: var(--accent); }


    .hero {
      height: 100svh; min-height: 500px;
      display: flex; align-items: flex-end;
      padding: 0 32px 64px; position: relative; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center 30%;
      filter: brightness(0.28) saturate(0.7);
      transform: scale(1.06);
      animation: slowzoom 22s ease-in-out infinite alternate;
    }
    @keyframes slowzoom {
      from { transform: scale(1.06); }
      to   { transform: scale(1.13); }
    }
    .hero-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to top,
        var(--black) 0%,
        rgba(8,8,8,0.55) 40%,
        transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; }
    .eyebrow {
      font-size: 0.58rem; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .eyebrow::before {
      content: ''; display: block; width: 30px; height: 1px; background: var(--accent);
    }
    h1 {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(4.5rem, 14vw, 12rem);
      line-height: 0.88; letter-spacing: -0.01em; color: var(--text);
    }
    h1 .out { -webkit-text-stroke: 1px var(--text); color: transparent; }
    .hero-sub {
      margin-top: 18px; font-size: 0.65rem; letter-spacing: 0.1em;
      color: var(--muted); line-height: 1.9;
    }
    .hero-scroll {
      position: absolute; right: 32px; bottom: 64px; z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      font-size: 0.5rem; letter-spacing: 0.3em; color: var(--muted);
      text-transform: uppercase; writing-mode: vertical-rl;
    }
    .scroll-line {
      width: 1px; height: 50px;
      background: linear-gradient(to bottom, var(--muted), transparent);
      animation: spulse 2s ease-in-out infinite;
    }
    @keyframes spulse { 0%,100%{opacity:.3} 50%{opacity:1} }


    section { padding: 60px 32px; }
    .section-header {
      display: flex; align-items: baseline; gap: 14px; margin-bottom: 36px;
    }
    .sec-num {
      font-family: 'Bebas Neue', cursive; font-size: 4rem;
      color: var(--grey); line-height: 1; user-select: none;
    }
    .sec-title {
      font-family: 'Bebas Neue', cursive; font-size: 2rem;
      letter-spacing: 0.1em; color: var(--text);
    }
    .sec-line { flex: 1; height: 1px; background: var(--grey); margin-left: 12px; align-self: center; }


    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      align-items: start;
    }
    .grid-item {
      position: relative; overflow: hidden;
      background: var(--grey); cursor: pointer;
    }
    .grid-item.landscape { grid-column: span 2; }

    .grid-item img {
      width: 100%; height: auto; display: block;
      transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94), filter 0.35s ease;
      filter: brightness(0.82) saturate(0.88);
    }
    .grid-item picture { display: block; width: 100%; overflow: hidden; }
    .grid-item:hover img,
    .grid-item:focus img {
      transform: scale(1.04);
      filter: brightness(1) saturate(1.05);
    }
    .grid-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(8,8,8,0.75) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.3s ease;
      display: flex; align-items: flex-end; padding: 14px;
    }
    .grid-item:hover .grid-overlay,
    .grid-item:focus .grid-overlay { opacity: 1; }
    .grid-num {
      font-family: 'Bebas Neue', cursive; font-size: 1.2rem;
      color: var(--accent); letter-spacing: 0.1em;
    }


    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .grid-item.landscape { grid-column: span 2; }
    }
    @media (max-width: 540px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 3px; }

      .grid-item.landscape { grid-column: span 2; }
    }


    .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }


    .lightbox {
      position: fixed; inset: 0;
      background: rgba(4,4,4,0.97);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .lightbox.active { opacity: 1; pointer-events: all; }
    .lightbox img {
      max-width: 92vw; max-height: 88vh; object-fit: contain;
      box-shadow: 0 0 120px rgba(0,0,0,0.9);
      transition: opacity 0.18s;
      display: block;
    }
    .lb-close {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: var(--text);
      font-family: 'Bebas Neue', cursive; font-size: 1.2rem; letter-spacing: 0.2em;
      cursor: pointer; transition: color 0.2s; z-index: 10;
      padding: 8px 12px;
    }
    .lb-close:hover { color: var(--accent); }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: none; border: 1px solid var(--mid); color: var(--text);
      font-family: 'Bebas Neue', cursive; font-size: 1.3rem; letter-spacing: 0.1em;
      padding: 10px 16px; cursor: pointer; transition: all 0.2s;
    }
    .lb-nav:hover { border-color: var(--accent); color: var(--accent); }
    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }
    .lb-counter {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 0.6rem; letter-spacing: 0.3em; color: var(--muted);
    }


    footer {
      padding: 48px 32px;
      border-top: 1px solid var(--grey);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 24px;
    }
    .footer-logo {
      font-family: 'Bebas Neue', cursive; font-size: 2.4rem;
      letter-spacing: 0.2em; color: var(--grey);
    }
    .footer-right {
      font-size: 0.56rem; color: var(--muted);
      letter-spacing: 0.16em; text-align: right; line-height: 2.2;
    }
    .footer-right a {
      color: var(--accent); text-decoration: none;
      font-size: 0.7rem; letter-spacing: 0.18em;
    }
    .footer-right a:hover { text-decoration: underline; }


    @media (max-width: 768px) {
      header { padding: 16px 20px; }
      nav { display: none; }
      .burger { display: flex; }

      .hero { padding: 0 20px 56px; }
      .hero-scroll { display: none; }

      section { padding: 48px 16px; }
      .sec-num { font-size: 3rem; }
      .sec-title { font-size: 1.6rem; }

      .lb-nav { padding: 8px 12px; font-size: 1rem; }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
      .lightbox img { max-width: 96vw; max-height: 82vh; }

      footer { padding: 36px 20px; flex-direction: column; align-items: flex-start; }
      .footer-right { text-align: left; }
    }

    @media (max-width: 400px) {
      h1 { font-size: clamp(3.5rem, 18vw, 5rem); }
      .logo { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#">dulu<em>.</em>hehe</a>
  <nav>
    <a href="#gallery">Galeria</a>
    <a href="https://www.instagram.com/dulu_hehe" target="_blank" rel="noopener">↗ Instagram</a>
  </nav>
  <button class="burger" id="burger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="mobile-nav" id="mobileNav">
  <a href="#gallery" onclick="closeMenu()">Galeria</a>
  <a href="https://www.instagram.com/dulu_hehe" target="_blank" rel="noopener" onclick="closeMenu()">↗ Instagram</a>
</div>

<div class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-grad"></div>
  <div class="hero-content">
    <div class="eyebrow">@dulu_hehe — Photography</div>
    <h1>DULU<br><span class="out">HEHE</span></h1>
    <p class="hero-sub">Muzyka. Światło. Chaos.<br>Uchwycone w jednym kadrze.</p>
  </div>
  <div class="hero-scroll"><div class="scroll-line"></div>scroll</div>
</div>

<section id="gallery">
  <div class="section-header fade-in">
    <span class="sec-num">01</span>
    <span class="sec-title">Galeria</span>
    <div class="sec-line"></div>
  </div>
  <div class="grid" id="photoGrid"></div>
</section>

<footer>
  <div class="footer-logo">dulu.hehe</div>
  <div class="footer-right">
    <a href="https://www.instagram.com/dulu_hehe" target="_blank" rel="noopener">@dulu_hehe</a><br>
    &copy; 2025 — Wszelkie prawa zastrzeżone<br>
    Wszystkie zdjęcia są własnością autora
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-close" onclick="closeLb()" aria-label="Zamknij">✕</button>
  <button class="lb-nav lb-prev" onclick="lbPrev()" aria-label="Poprzednie">&#8592;</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" onclick="lbNext()" aria-label="Następne">&#8594;</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
  const PHOTOS = [
    '_DSC0025-Poprawione-Szum.jpg',
    '_DSC0112.jpg',
    '_DSC0275.jpg',
    '_DSC0279.jpg',
    '_DSC0348-Poprawione-Szum.jpg',
    '_DSC0528-Poprawione-Szum.jpg',
    '_DSC0600-Poprawione-Szum.jpg',
    '_DSC0647.jpg',
    '_DSC0906.jpg',
    '_DSC1203-Poprawione-Szum-2.jpg',
    '_DSC1674.jpg',
    '_DSC2431-Poprawione-Szum.jpg',
    '_DSC2451.jpg',
    '_DSC2459.jpg',
    '_DSC3077.jpg',
    '_DSC3088.jpg',
    '_DSC3109.jpg',
    '_DSC3137.jpg',
    '_DSC3155.jpg',
    '_DSC3241.jpg',
    '_DSC3244.jpg',
    '_DSC3273.jpg',
    '_DSC3461.jpg',
    '_DSC3557.jpg',
    '_DSC3640.jpg',
    '_DSC4086.jpg',
    '_DSC4182.jpg',
    '_DSC4640.jpg',
    '_DSC4671.jpg',
    '_DSC4676.jpg',
    '_DSC4714.jpg',
    '_DSC4814.jpg',
    '_DSC5653.jpg',
    '_DSC6175.jpg',
    '_DSC6260.jpg',
    '_DSC6899.jpg',
    '_DSC7040-Poprawione-Szum.jpg',
    '_DSC7109-Poprawione-Szum.jpg',
    '_DSC7190.jpg',
    '_DSC7312.jpg',
    '_DSC7367.jpg',
    '_DSC7436.jpg',
    '_DSC7518.jpg',
    '_DSC7613.jpg',
    '_DSC7755.jpg',
    '_DSC7766.jpg',
    '_DSC7768.jpg',
    '_DSC7958.jpg',
    '_DSC8039.jpg',
    '_DSC8767.jpg',
    '_DSC8828-Poprawione-Szum.jpg',
    '_DSC9033.jpg',
    '_DSC9134.jpg',
    '_DSC9207-Poprawione-Szum.jpg',
    '_DSC9444.jpg',
    '_DSC9565.jpg',
    '_DSC9693-Poprawione-Szum.jpg',
    '_DSC9773.jpg',
    '_DSC9788-Poprawione-Szum.jpg',
    '_DSC9919-Poprawione-Szum.jpg',
    '_DSC9971-Poprawione-Szum.jpg',
  ];

  function baseName(n) { return n.startsWith('top_') ? n.slice(4) : n; }
  function toWebP(n, size) { return `photos/webp/${size}/${baseName(n).replace(/\.(jpe?g|png)$/i, '.webp')}`; }
  function toAvif(n, size) { return `photos/avif/${size}/${baseName(n).replace(/\.(jpe?g|png)$/i, '.avif')}`; }

  const topPhoto = PHOTOS.find(p => p.startsWith('top_')) || PHOTOS[0];
  document.getElementById('heroBg').style.backgroundImage = `url('${toWebP(topPhoto, 'full')}')`;

  let photos = [];
  let currentIdx = 0;

  function getOrientation(url) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload  = () => resolve(img.naturalWidth >= img.naturalHeight ? 'landscape' : 'portrait');
      img.onerror = () => resolve('portrait');
      img.src = url;
    });
  }

  function makePicture(name, size) {
    const pic = document.createElement('picture');
    const sa = document.createElement('source');
    sa.type = 'image/avif'; sa.srcset = toAvif(name, size);
    const sw = document.createElement('source');
    sw.type = 'image/webp'; sw.srcset = toWebP(name, size);
    const img = document.createElement('img');
    img.src = toWebP(name, size);
    img.alt = baseName(name);
    img.loading = 'lazy';
    img.decoding = 'async';
    pic.append(sa, sw, img);
    return pic;
  }

  async function init() {
    const grid = document.getElementById('photoGrid');

    for (let i = 0; i < PHOTOS.length; i++) {
      const name = PHOTOS[i];
      const orient = await getOrientation(toWebP(name, 'small'));
      const isLandscape = orient === 'landscape';
      photos.push({ name, landscape: isLandscape });

      const item = document.createElement('div');
      item.className = `grid-item fade-in ${isLandscape ? 'landscape' : 'portrait'}`;
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `Zdjęcie ${i + 1}`);
      item.style.transitionDelay = `${(i % 9) * 0.035}s`;

      const pic = makePicture(name, 'small');

      const ov = document.createElement('div');
      ov.className = 'grid-overlay';
      ov.innerHTML = `<span class="grid-num">${String(i+1).padStart(2,'0')}</span>`;

      item.append(pic, ov);
      item.addEventListener('click', () => openLb(i));
      item.addEventListener('keydown', e => { if (e.key === 'Enter') openLb(i); });
      grid.appendChild(item);
    }

    observeFadeIns();
  }

  const lbEl = document.getElementById('lightbox');
  const lbOldImg = document.getElementById('lbImg');
  const lbPic = document.createElement('picture');
  const lbSrcAvif = document.createElement('source'); lbSrcAvif.type = 'image/avif';
  const lbSrcWebp = document.createElement('source'); lbSrcWebp.type = 'image/webp';
  const lbImg = document.createElement('img'); lbImg.id = 'lbImg'; lbImg.alt = '';
  lbPic.append(lbSrcAvif, lbSrcWebp, lbImg);
  lbOldImg.replaceWith(lbPic);

  function openLb(idx) {
    currentIdx = idx;
    updateLb();
    lbEl.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    lbEl.classList.remove('active');
    document.body.style.overflow = '';
  }
  function updateLb() {
    const name = photos[currentIdx].name;
    lbImg.style.opacity = 0;
    lbSrcAvif.srcset = toAvif(name, 'full');
    lbSrcWebp.srcset = toWebP(name, 'full');
    lbImg.src = toWebP(name, 'full');
    lbImg.onload = () => { lbImg.style.opacity = 1; };
    document.getElementById('lbCounter').textContent =
      `${String(currentIdx+1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;
  }
  function lbNext() { currentIdx = (currentIdx + 1) % photos.length; updateLb(); }
  function lbPrev() { currentIdx = (currentIdx - 1 + photos.length) % photos.length; updateLb(); }

  let tsX = null;
  lbEl.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; }, { passive: true });
  lbEl.addEventListener('touchend', e => {
    if (tsX === null) return;
    const dx = e.changedTouches[0].clientX - tsX;
    if (Math.abs(dx) > 40) { dx < 0 ? lbNext() : lbPrev(); }
    tsX = null;
  });

  document.addEventListener('keydown', e => {
    if (!lbEl.classList.contains('active')) return;
    if (e.key === 'ArrowRight') lbNext();
    if (e.key === 'ArrowLeft')  lbPrev();
    if (e.key === 'Escape')     closeLb();
  });
  lbEl.addEventListener('click', function(e) { if (e.target === this) closeLb(); });

  const burger = document.getElementById('burger');
  const mobileNav = document.getElementById('mobileNav');
  burger.addEventListener('click', () => {
    const open = mobileNav.classList.toggle('open');
    burger.classList.toggle('open', open);
    document.body.style.overflow = open ? 'hidden' : '';
  });
  function closeMenu() {
    mobileNav.classList.remove('open');
    burger.classList.remove('open');
    document.body.style.overflow = '';
  }

  function observeFadeIns() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });
    document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
  }

  observeFadeIns();
  init();
</script>
</body>
</html>
